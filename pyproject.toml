[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-cost-anomaly-detector"
version = "0.1.0"
description = "Monitors rolling per-workflow token spend and retry bursts using z-score anomaly detection to halt runaway costs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
telemetry-cost-anomaly-detector = "telemetry_cost_anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telemetry_cost_anomaly_detector*"]
